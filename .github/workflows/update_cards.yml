name: Update README stats cards

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC (off-peak; top-of-hour slots get delayed/dropped)
  workflow_dispatch:

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # The stats card needs USER-level data (contributions across the whole account),
    # which the repo-scoped GITHUB_TOKEN cannot read ("Resource not accessible by
    # integration"). It requires a PAT in the STATS_TOKEN secret (classic, read:user).
    # When STATS_TOKEN is absent, the two stats steps are SKIPPED so the committed
    # stats.svg / stats-light.svg are left untouched instead of being overwritten with
    # an error card. top-langs only needs repo data, so it always runs on GITHUB_TOKEN.
    env:
      HAS_STATS_TOKEN: ${{ secrets.STATS_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v6

      # Without STATS_TOKEN the two stats steps skip, top-langs regenerates
      # byte-identically, `git commit` finds nothing, and `|| exit 0` turns the
      # whole run green. That combination froze stats.svg for 8 days while 43
      # consecutive runs reported success. Surface it instead of hiding it.
      - name: Check STATS_TOKEN is present
        if: ${{ env.HAS_STATS_TOKEN != 'true' }}
        run: |
          {
            echo "### Stats cards NOT updated"
            echo ""
            echo "\`STATS_TOKEN\` is not set, so the stats cards were skipped and"
            echo "\`profile/stats.svg\` keeps whatever it last contained."
            echo ""
            echo "Fix: create a classic PAT with the \`read:user\` scope and add it"
            echo "as the \`STATS_TOKEN\` repository secret."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=STATS_TOKEN missing::Stats cards skipped; profile/stats.svg is stale."

      - name: Generate stats card
        if: ${{ env.HAS_STATS_TOKEN == 'true' }}
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=reviews&hide=contribs&hide_border=true&card_width=495&line_height=26&title_color=a5b4fc&icon_color=8b7ff5&text_color=c9d1d9&ring_color=a5b4fc&bg_color=0d1117
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate stats card (light)
        if: ${{ env.HAS_STATS_TOKEN == 'true' }}
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=reviews&hide=contribs&hide_border=true&card_width=495&line_height=26&title_color=4f46e5&icon_color=6366f1&text_color=24292f&ring_color=4f46e5&bg_color=ffffff
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&card_width=495&title_color=a5b4fc&text_color=c9d1d9&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&card_width=495&title_color=4f46e5&text_color=24292f&bg_color=ffffff
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "Urme"
          git config user.email "148221893+urmeo@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No card changed; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "updated stats"
          git pull --rebase -X theirs origin main
          git push
          echo "Committed refreshed cards: $(git diff --name-only HEAD~1 HEAD | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
