name: Update README stats cards

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC (off-peak; top-of-hour slots get delayed/dropped)
  workflow_dispatch:

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # The stats card was gated on a PAT for years on the belief that the repo-scoped
    # GITHUB_TOKEN could not read account-level contribution data. That was measured
    # on 2026-08-04 and is false: GITHUB_TOKEN answers user(login:).contributionsCollection
    # fine. So the cards now build unconditionally on GITHUB_TOKEN and refresh daily
    # with no secret at all.
    #
    # STATS_TOKEN is still honoured when set, and is the ONLY difference that matters:
    # a classic PAT with `repo` scope also counts commits in PRIVATE repositories
    # (restrictedContributionsCount). Measured the same day: 1623 commits via
    # GITHUB_TOKEN, 1931 via a repo-scoped PAT. Public-only is the honest default;
    # add the secret if the private work should count.
    env:
      HAS_STATS_TOKEN: ${{ secrets.STATS_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          # The staleness check below reads the card's last commit date, which
          # a depth-1 checkout cannot see.
          fetch-depth: 0

      # Without STATS_TOKEN the two stats steps skip, top-langs regenerates
      # byte-identically, `git commit` finds nothing, and `|| exit 0` turns the
      # whole run green. That combination froze stats.svg for 8 days while 43
      # consecutive runs reported success. Surface it instead of hiding it.
      - name: Note which token is in use
        run: |
          if [ "${HAS_STATS_TOKEN}" = "true" ]; then
            echo "STATS_TOKEN present: commits in private repositories are counted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Using GITHUB_TOKEN::Cards build without a PAT. Commits in private repositories are not counted; add a STATS_TOKEN secret (classic PAT, repo scope) to include them."
            echo "No STATS_TOKEN: cards build on GITHUB_TOKEN and count public contributions only." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=reviews&hide=contribs&hide_border=true&card_width=495&line_height=26&title_color=a5b4fc&icon_color=8b7ff5&text_color=c9d1d9&ring_color=a5b4fc&bg_color=0d1117
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&show=reviews&hide=contribs&hide_border=true&card_width=495&line_height=26&title_color=4f46e5&icon_color=6366f1&text_color=24292f&ring_color=4f46e5&bg_color=ffffff
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # A token that is present but bad (expired, wrong scope, revoked) does NOT
      # skip these steps -- the generator runs and can emit an "error card", which
      # the commit step would then publish to the profile. Absence is already
      # guarded; this guards presence-but-broken. Only runs when we actually tried.
      - name: Validate the generated stats cards
        run: |
          fail=0
          for card in profile/stats.svg profile/stats-light.svg; do
            if [ ! -s "$card" ]; then
              echo "::error title=Stats card empty::$card is missing or zero bytes."
              fail=1; continue
            fi
            bytes=$(wc -c < "$card")
            if [ "$bytes" -lt 2000 ]; then
              echo "::error title=Stats card too small::$card is ${bytes} bytes; a real card is ~8 kB."
              fail=1
            fi
            if grep -qiE 'something went wrong|not accessible|maximum retries|rate limit|invalid username|could not fetch' "$card"; then
              echo "::error title=Stats card is an error card::$card contains a generator error message."
              grep -oiE 'something went wrong[^<]*|not accessible[^<]*|maximum retries[^<]*|rate limit[^<]*' "$card" | head -3
              fail=1
            fi
            if ! grep -q 'Total Stars Earned' "$card"; then
              echo "::error title=Stats card missing data::$card has no 'Total Stars Earned' row."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            {
              echo "### Stats cards rejected"
              echo ""
              echo "The generator ran but produced something that is not a valid stats card."
              echo "The most likely cause is a \`STATS_TOKEN\` that has expired, been revoked,"
              echo "or lacks the \`read:user\` scope. The committed cards were left untouched."
            } >> "$GITHUB_STEP_SUMMARY"
            git checkout -- profile/stats.svg profile/stats-light.svg 2>/dev/null || true
            exit 1
          fi
          echo "Stats cards look valid ($(wc -c < profile/stats.svg) bytes)."

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&card_width=495&title_color=a5b4fc&text_color=c9d1d9&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&card_width=495&title_color=4f46e5&text_color=24292f&bg_color=ffffff
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "Urme"
          git config user.email "148221893+urmeo@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No card changed; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "updated stats"
          git pull --rebase -X theirs origin main
          git push
          echo "Committed refreshed cards: $(git diff --name-only HEAD~1 HEAD | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      # A token-presence check only catches the token being ABSENT. It says nothing
      # about a token that EXPIRED, an action that silently returned a stale card, or
      # any future cause. This asserts the outcome instead of the cause: if the card
      # itself has not moved in over MAX_AGE_DAYS, say so, whatever the reason.
      - name: Warn if the stats card is stale
        if: always()
        env:
          MAX_AGE_DAYS: "3"
        run: |
          card=profile/stats.svg
          if [ ! -f "$card" ]; then
            echo "::warning title=Stats card missing::$card does not exist."
            exit 0
          fi
          last=$(git log -1 --format=%cI -- "$card")
          if [ -z "$last" ]; then
            echo "::warning title=Stats card age unknown::No commit found for $card; cannot check freshness."
            exit 0
          fi
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "$card last changed $last (${age_days}d ago); threshold ${MAX_AGE_DAYS}d."
          if [ "$age_days" -gt "${MAX_AGE_DAYS}" ]; then
            {
              echo "### Stats card is stale"
              echo ""
              echo "\`$card\` last changed **${age_days} days ago** (${last}), over the ${MAX_AGE_DAYS}-day threshold."
              echo ""
              echo "Most likely \`STATS_TOKEN\` is unset or has expired. Check the run log above:"
              echo "a skipped \"Generate stats card\" step means the secret is missing; a failed one"
              echo "means it is present but rejected."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Stats card stale::$card has not changed in ${age_days} days (threshold ${MAX_AGE_DAYS})."
          else
            echo "Stats card is fresh." >> "$GITHUB_STEP_SUMMARY"
          fi
