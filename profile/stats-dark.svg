    .value { font-size: 15px; font-weight: 650; fill: #e6edf3; font-variant-numeric: tabular-nums; }
    .language { font-size: 12px; fill: #e6edf3; }
    .percent { font-size: 12px; font-weight: 600; fill: #e6edf3; font-variant-numeric: tabular-nums; }
